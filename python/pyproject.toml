[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "one-shot-ai"
version = "0.1.0"
description = "DINOv2 -> TFLite export pipeline and local tests for oneShot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  { name = "oneShot" }
]
dependencies = [
  # Core ML frameworks
  "torch>=2.2.0",
  "torchvision>=0.15.0",
  "tensorflow>=2.16.1,<2.19",
  "tf-keras>=2.16.0,<2.19",
  "transformers>=4.35.0",
  
  # Model libraries
  "timm>=0.9.8",
  
  # ONNX and conversion tools
  "onnx>=1.15.0",
  "onnxruntime>=1.17.0",
  "onnx2tf>=1.19.0,<2.0.0",
  "onnx-graphsurgeon>=0.3.26",
  "sng4onnx>=1.0.0",
  
  # Image processing
  "pillow>=10.0.0",
  "opencv-python>=4.8.0",
  
  # Data processing and analysis
  "numpy>=1.24.0",
  "pandas>=2.0.0",
  "scikit-learn>=1.3.0",
  
  # Visualization
  "matplotlib>=3.8.0",
  
  # Utilities
  "tqdm>=4.66.0",
  "psutil>=5.9.0",
  
  # Photo metadata and location
  "exifread>=3.0.0",
  "geopy>=2.4.0",
  
  # Face recognition
  "face-recognition>=1.3.0",
]

[project.scripts]
dinov2-export = "dinov2_export:main"
verify-tflite = "verify_tflite:main"
auto-label = "training.auto_labeler:main"
train-dinov2 = "training.dinov2_finetune:main"
extract-embeddings = "training.extract_embeddings:main"
fit-pca = "training.pca_whitening:main"
export-tflite = "training.tflite_export:main"
face-score = "training.face_aware_scoring:main"
rerank = "training.reranking_module:main"
final-select = "training.final_selection:main"
pipeline = "training.pipeline:main"
project-manager = "training.project_manager:main"
dataset-validator = "training.utils:main"
test-install = "test_installation:main"
deploy-models = "deploy_models:main"

[tool.uv]
index-url = "https://pypi.org/simple"
compile-bytecode = true
dev-dependencies = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.7.0",
  "ruff>=0.1.0",
  "mypy>=1.5.0",
  "ipython>=8.14.0",
  "jupyter>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501",  # line too long, handled by black
  "B008",  # do not perform function calls in argument defaults
  "C901",  # too complex
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_any_generics = false
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = [
  "training",
  "models", 
  "preprocessing",
  "similarity",
  "tflite_convert"
]

[project.optional-dependencies]
onnxsim = [
  # CMake 3.30+ drops compatibility with projects declaring
  # cmake_minimum_required lower than 3.5 (used by onnx submodules).
  # Pin to <3.30 to avoid the policy error during build.
  "cmake<3.30",
  "onnxsim>=0.4.36",
]

dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
  "black>=23.7.0",
  "ruff>=0.1.0",
  "mypy>=1.5.0",
  "ipython>=8.14.0",
  "jupyter>=1.0.0",
]

training = [
  "tensorboard>=2.14.0",
  "wandb>=0.15.0",
  "albumentations>=1.3.0",
]

mobile = [
  "coremltools>=7.0",  # For iOS Core ML export
  "tensorflowjs>=4.10.0",  # For web deployment
]
